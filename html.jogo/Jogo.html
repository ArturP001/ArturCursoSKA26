<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RPG Battle</title>
    <meta
      name="description"
      content="Jogo de batalha RPG entre Cavaleiro e Mago."
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="Jogo.css" />
  </head>
  <body>
    <!-- Titulo principal do jogo -->
    <h1>RPG BATTLE</h1>

    <!-- Area onde o jogador escolhe os personagens da batalha -->
    <div class="selecao-personagens">
      <div class="selecao-bloco">
        <label for="select-player1">Jogador 1</label>
        <select id="select-player1">
          <option value="cavaleiro">Cavaleiro</option>
          <option value="mago">Mago</option>
          <option value="arqueiro">Arqueiro</option>
        </select>
      </div>

      <div class="selecao-bloco">
        <label for="select-player2">Jogador 2</label>
        <select id="select-player2">
          <option value="mago">Mago</option>
          <option value="cavaleiro">Cavaleiro</option>
          <option value="arqueiro">Arqueiro</option>
        </select>
      </div>
    </div>

    <!-- Arena mostra os dois personagens, imagens e barras de vida -->
    <div class="arena">
      <div class="personagem">
        <img
          id="imagemCavaleiro"
          src="https://static.vecteezy.com/system/resources/previews/069/210/287/non_2x/pixel-art-cat-warrior-in-red-cape-png.png"
          alt="Cavaleiro"
          class="imagem"
          loading="lazy"
        />

        <div class="hp-bloco">
          <div class="hp-label">
            <span>HP</span>
            <span id="cavaleiro-hp">100 / 100</span>
          </div>
          <div class="hp-trilho">
            <div class="hp-fill" id="cavaleiro-bar"></div>
          </div>
        </div>

        <p class="nome" id="nome-cavaleiro">Cavaleiro</p>
      </div>

      <span class="vs">VS</span>

      <!-- Segundo personagem da batalha -->
      <div class="personagem">
        <img
          id="imagemMago"
          src="https://static.vecteezy.com/system/resources/thumbnails/069/209/991/small/pixel-art-wizard-cat-with-staff-and-purple-robe-png.png"
          alt="Mago"
          class="imagem"
          loading="lazy"
        />

        <div class="hp-bloco">
          <div class="hp-label">
            <span>HP</span>
            <span id="mago-hp">100 / 100</span>
          </div>
          <div class="hp-trilho">
            <div class="hp-fill" id="mago-bar"></div>
          </div>
        </div>

        <p class="nome" id="nome-mago">Mago</p>
      </div>
    </div>

    <!-- Botoes principais para iniciar ou reiniciar o jogo -->
    <div class="botoes" role="group" aria-label="Acoes de batalha">
      <button class="btn btn--ataque" id="btn-jogar">Jogar</button>
      <button class="btn btn--reiniciar" id="btn-reiniciar">Reiniciar</button>
    </div>

    <!-- Console onde aparecem as mensagens da luta -->
    <div class="console" id="console" role="log" aria-live="polite">
      Aguardando batalha...
    </div>

    <!-- Arquivo JavaScript gerado pelo TypeScript -->
    <script src="jogo.js"></script>
  </body>
</html>
