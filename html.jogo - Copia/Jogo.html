<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RPG Battle</title>
    <meta
      name="description"
      content="Jogo de batalha RPG entre Cavaleiro, Mago e Arqueiro."
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="Jogo.css" />
  </head>
  <body>
    <main class="jogo">
      <!-- Tela inicial: escolha dos personagens -->
      <section class="tela tela-menu" id="tela-menu">
        <h1>RPG BATTLE</h1>

        <div class="selecao-personagens">
          <div class="selecao-bloco">
            <label for="select-player1">Jogador 1</label>
            <select id="select-player1">
              <option value="cavaleiro">Cavaleiro</option>
              <option value="mago">Mago</option>
              <option value="arqueiro">Arqueiro</option>
            </select>
          </div>

          <div class="selecao-bloco">
            <label for="select-player2">Jogador 2</label>
            <select id="select-player2">
              <option value="mago">Mago</option>
              <option value="cavaleiro">Cavaleiro</option>
              <option value="arqueiro">Arqueiro</option>
            </select>
          </div>
        </div>

        <button class="btn btn--ataque" id="btn-comecar" type="button">
          Come&ccedil;ar batalha
        </button>
      </section>

      <!-- Tela da batalha -->
      <section class="tela tela-batalha escondido" id="tela-batalha">
        <h1>RPG BATTLE</h1>

        <div class="arena">
          <div class="personagem">
            <img
              id="imagemCavaleiro"
              src="https://static.vecteezy.com/system/resources/previews/069/210/287/non_2x/pixel-art-cat-warrior-in-red-cape-png.png"
              alt="Personagem do jogador 1"
              class="imagem"
              loading="lazy"
            />

            <div class="hp-bloco">
              <div class="hp-label">
                <span>HP</span>
                <span id="cavaleiro-hp">100 / 100</span>
              </div>
              <div class="hp-trilho">
                <div class="hp-fill" id="cavaleiro-bar"></div>
              </div>
            </div>

            <p class="nome" id="nome-cavaleiro">Cavaleiro</p>
          </div>

          <span class="vs">VS</span>

          <div class="personagem">
            <img
              id="imagemMago"
              src="https://static.vecteezy.com/system/resources/thumbnails/069/209/991/small/pixel-art-wizard-cat-with-staff-and-purple-robe-png.png"
              alt="Personagem do jogador 2"
              class="imagem"
              loading="lazy"
            />

            <div class="hp-bloco">
              <div class="hp-label">
                <span>HP</span>
                <span id="mago-hp">100 / 100</span>
              </div>
              <div class="hp-trilho">
                <div class="hp-fill" id="mago-bar"></div>
              </div>
            </div>

            <p class="nome" id="nome-mago">Mago</p>
          </div>
        </div>

        <div class="botoes" role="group" aria-label="A&ccedil;&otilde;es de batalha">
          <button class="btn btn--reiniciar" id="btn-reiniciar" type="button">
            Reiniciar
          </button>
          <button class="btn btn--magia" id="btn-voltar-menu" type="button">
            Trocar personagens
          </button>
        </div>

        <div class="console" id="console" role="log" aria-live="polite">
          Aguardando batalha...
        </div>
      </section>
    </main>

    <script src="jogo.js"></script>
  </body>
</html>
